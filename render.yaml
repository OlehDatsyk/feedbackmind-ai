# Render Blueprint for FeedbackMind AI.
#
# Services:
#   feedbackmind-ai-db        Render PostgreSQL (all application data, uploaded import files until processed,
#                             and generated reports are stored here - nothing relies on the ephemeral disk)
#   feedbackmind-ai-api       FastAPI web service. EMBEDDED_WORKER=true runs the durable, database-backed job
#                             worker (imports, AI analysis, reports, alert checks) inside the API process.
#   feedbackmind-ai-frontend  React static site (SPA rewrite to index.html)
#
# Free-plan notes: free web services sleep after ~15 minutes without traffic; queued jobs stay in PostgreSQL and
# resume when the service wakes. Free Render PostgreSQL databases expire 30 days after creation unless upgraded.
#
# Scaling up (paid plans): set EMBEDDED_WORKER=false on the API and add a background worker:
#   - type: worker
#     name: feedbackmind-ai-worker
#     runtime: python
#     rootDir: backend
#     buildCommand: pip install -r requirements.txt
#     startCommand: python -m app.worker
#     envVars: same as the API (DATABASE_URL, SECRET_KEY, ENCRYPTION_KEY, AI_* ...)
# No Redis is required: the job queue lives in PostgreSQL.
#
# Secrets are never committed: SECRET_KEY and ENCRYPTION_KEY are generated by Render; AI keys are entered in the
# dashboard (sync: false).

databases:
  - name: feedbackmind-ai-db
    databaseName: feedbackmind
    user: feedbackmind
    plan: free
    region: frankfurt

services:
  - type: web
    name: feedbackmind-ai-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations are additive and idempotent; they run before the server binds.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: feedbackmind-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true # 256-bit base64 value, normalised to a Fernet key by the app; never rotate without re-entering stored secrets
      - key: CORS_ORIGINS
        value: https://feedbackmind-ai-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://feedbackmind-ai-frontend.onrender.com
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      - key: DOCS_ENABLED
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_IMPORT_MB
        value: "20"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: AI_PROVIDER
        value: none # set anthropic / openai / gemini together with the matching API key to enable AI
      - key: AI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: feedbackmind-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://feedbackmind-ai-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
